<section class="my-10 px-4 py-12 sm:px-6 lg:px-8 mx-auto lg:max-w-7xl">
  <h2 class="pb-5 text-base font-semibold dark:text-white">Últimos 30 dias</h2>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
    @for (stat of stats; track stat.id) {
    <app-home-stats-item [name]="stat.name" [title]="stat.title" [value]="stat.value"></app-home-stats-item>
    }
  </div>
</section>
